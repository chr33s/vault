name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test + typecheck + zero-dep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Node 26 is the platform baseline (plan §1): type stripping is the
          # default, node:sqlite is stable, and SEA is built in. Pin the exact
          # patch per release (plan §11) and re-run on every Node bump.
          node-version-file: "package.json"
      - run: npm ci
      - run: npm run check
      - run: npm run check:deps
      - run: npm run typecheck
      - run: npm test

  strong-tier:
    name: strong-tier (swtpm TPM2, linux)
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
      - run: sudo apt-get update && sudo apt-get install -y swtpm swtpm-tools
      - run: npm ci
      - run: node --test test/tpm2.test.ts

  sea:
    name: sea binary (${{ matrix.target }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-14, target: darwin-arm64 } # arm64 only (plan §1, §7)
          - { os: windows-2025, target: win-x64 } # pinned: windows-latest redirects to windows-2025-vs2026 by 2026-06-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
      - run: npm ci
      - shell: bash
        run: npm run build:sea
      - shell: bash
        run: |
          BIN=dist/vault; [ -f dist/vault.exe ] && BIN=dist/vault.exe
          VAULT_BIN="$BIN" node --test test/sea.test.ts
      - uses: actions/upload-artifact@v7
        with:
          name: vault-${{ matrix.target }}
          path: |
            dist/vault*

  native-windows:
    name: native hello helper (win-x64)
    needs: test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
      - run: npm ci
      # Compile the WinRT helper — validates the CsWinRT projections and the
      # WinVerifyTrust interop actually build against the Windows SDK. Self-contained
      # single-file so the ONE published .exe is a drop-in sibling of vault.exe with
      # no .NET runtime install on the user's box (matching the standalone macOS
      # vault-helper); a framework-dependent apphost stub can't run on its own.
      - run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true native/hello-helper
      # Run the hello-tier tests on real Windows: the PowerShell WinRT projection
      # script and the compiled helper must answer `available` cleanly. Runners
      # have no Hello enrolled, so the tier legitimately reports unavailable;
      # the gesture paths need a real Hello-enrolled host (see native/hello-helper).
      - shell: bash
        run: |
          VAULT_HELLO_HELPER="$PWD/native/hello-helper/bin/Release/net8.0-windows10.0.19041.0/win-x64/publish/vault-hello-helper.exe" \
            node --test test/hello.test.ts
      - uses: actions/upload-artifact@v7
        with:
          name: vault-hello-helper-win-x64
          path: native/hello-helper/bin/Release/net8.0-windows10.0.19041.0/win-x64/publish/vault-hello-helper.exe

  cleanup-artifacts:
    name: cleanup old artifacts
    needs: [sea, native-windows]
    # Runs even when an upload job fails, but only on push: pull_request runs
    # from forks get a read-only token and could never delete anything.
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            // Keep only the newest 3 artifacts per name (one per SEA target
            // plus the Hello helper) so old runs don't eat the storage quota.
            const keep = 3;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 },
            );
            const byName = new Map();
            for (const artifact of artifacts) {
              if (artifact.expired) continue;
              if (!byName.has(artifact.name)) byName.set(artifact.name, []);
              byName.get(artifact.name).push(artifact);
            }
            for (const [name, group] of byName) {
              group.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              for (const artifact of group.slice(keep)) {
                core.info(`Deleting ${name} #${artifact.id} (${artifact.created_at})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }

  native:
    name: native helper + app (darwin-arm64)
    needs: sea
    runs-on: macos-14 # Apple Silicon (arm64), matches the SEA target (plan §1, §7)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
      - run: npm ci
      # vault.xcodeproj uses objectVersion 77 (Xcode 16 project format); the
      # macos-14 runner defaults to Xcode 15.4, which can't read it. Pick the
      # newest installed Xcode 16.x.
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - shell: bash
        run: npm run build:sea
      - run: swift build -c release --arch arm64 --product vault-helper
        working-directory: native
      - run: ./build.sh
        working-directory: native
      - run: codesign --verify --deep --strict --verbose=2 native/vault.app
