name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test + typecheck + zero-dep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Node 26 runs the Worker's TypeScript directly (type stripping is the
          # default). Pin the exact patch per release and re-run on every Node bump.
          node-version-file: "package.json"
      - run: npm ci
      - run: npm run check
      - run: npm run check:deps
      - run: npm run typecheck
      - run: npm test

  native-windows:
    name: native hello helper (win-x64)
    needs: test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      # Compile the WinRT helper — validates the CsWinRT projections and the
      # WinVerifyTrust interop actually build against the Windows SDK. Self-contained
      # single-file so the ONE published .exe is a drop-in sibling of vault.exe with
      # no .NET runtime install on the user's box; a framework-dependent apphost stub can't run on its own.
      - run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true windows/hello-helper
      - uses: actions/upload-artifact@v7
        with:
          name: vault-hello-helper-win-x64
          path: windows/hello-helper/bin/Release/net8.0-windows10.0.19041.0/win-x64/publish/vault-hello-helper.exe

  cleanup-artifacts:
    name: cleanup old artifacts
    needs: [swift, native-windows]
    # Runs even when an upload job fails, but only on push: pull_request runs
    # from forks get a read-only token and could never delete anything.
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            // Keep only the newest 3 artifacts per name (one per Swift target
            // plus the Hello helper) so old runs don't eat the storage quota.
            const keep = 3;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 },
            );
            const byName = new Map();
            for (const artifact of artifacts) {
              if (artifact.expired) continue;
              if (!byName.has(artifact.name)) byName.set(artifact.name, []);
              byName.get(artifact.name).push(artifact);
            }
            for (const [name, group] of byName) {
              group.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              for (const artifact of group.slice(keep)) {
                core.info(`Deleting ${name} #${artifact.id} (${artifact.created_at})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }

  native:
    name: native app (darwin-arm64)
    needs: test
    runs-on: xcode-27 # Apple Silicon (arm64); preview image with Xcode 27 (Swift 6.4)
    steps:
      - uses: actions/checkout@v6
      - run: sudo xcode-select -s /Applications/Xcode_27.0.app
      # The app links the Swift engine directly (no Node SEA, no vault-helper).
      - run: ./build.sh
        working-directory: macos
      - run: codesign --verify --deep --strict --verbose=2 macos/vault.app

  # Swift local stack (vault.spec.md §15.16): build + unit/vector tests on every
  # client OS. Vectors in protocol/vectors are frozen fixtures.
  swift:
    name: swift (${{ matrix.target }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: xcode-27, target: macos-arm64 }
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: windows-2025, target: windows-x64 }
    # Windows builds without VaultNet (no relay/serve/proxy/tailnet sync) and with the
    # vendored SQLite; see swift/Package.swift.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # a hung test must fail, not burn the 6h default
    steps:
      - uses: actions/checkout@v6
      # macOS uses the runner's Xcode 27 toolchain (Swift 6.4); elsewhere install the same release.
      - if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_27.0.app
      - if: runner.os != 'macOS'
        uses: SwiftyLab/setup-swift@9014d4136569075c696d4151c7810ecde8712907 # v1.14.1
        with:
          swift-version: "6.4"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config
      - working-directory: swift
        run: swift build -c release
      - working-directory: swift
        run: swift test
      - shell: bash
        run: |
          BIN=swift/.build/release/vault; [ -f "$BIN" ] || BIN="$(cd swift && swift build -c release --show-bin-path)/vault"
          [ -f "$BIN" ] || BIN="$BIN.exe"
          mkdir -p dist && cp "$BIN" dist/
      - uses: actions/upload-artifact@v7
        with:
          name: vault-${{ matrix.target }}
          path: dist/vault*

  # The tpm2-tools key store against a real TPM implementation (swtpm): the unit tests use
  # a stub, so this is what actually exercises tpm2_createprimary/create/load/unseal, the
  # PIN path and name binding.
  tpm2:
    name: tpm2-tools keystore (swtpm, linux)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: SwiftyLab/setup-swift@9014d4136569075c696d4151c7810ecde8712907 # v1.14.1
        with:
          swift-version: "6.4"
      - run: sudo apt-get update && sudo apt-get install -y swtpm swtpm-tools tpm2-tools libsqlite3-dev pkg-config
      - name: start swtpm
        run: |
          mkdir -p "$RUNNER_TEMP/tpm"
          swtpm_setup --tpmstate "$RUNNER_TEMP/tpm" --tpm2 --createek --create-ek-cert --create-platform-cert --lock-nvram --overwrite --display || true
          swtpm socket --tpmstate dir="$RUNNER_TEMP/tpm" --tpm2 \
            --server type=tcp,port=2321 --ctrl type=tcp,port=2322 --flags not-need-init,startup-clear --daemon
          echo "TPM2TOOLS_TCTI=swtpm:port=2321" >> "$GITHUB_ENV"
      - working-directory: swift
        run: VAULT_TPM2_REAL=1 swift test --filter realTpm
